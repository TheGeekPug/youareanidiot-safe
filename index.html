<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="This is the orgional and the best flash video on the 'net. Once found on www.youdontknowwhoiam.org, not found where it belong, right here on...">
    <title>You are an idiot!</title>
    <!-- Más información sobre la fuente: TheGeekPug -->
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: "Times New Roman", Times, serif; }
        #bg-text { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 8vw; font-weight: bold; text-align: center; z-index: 1; animation: flash 0.666s infinite steps(1); line-height: 1.2; }
        #bg-text span { font-size: 10vw; margin-top: 20px; } /* Caras GRANDES exclusivas del Home */
        #speaker-btn { position: absolute; top: 15px; left: 15px; width: 50px; height: 50px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; z-index: 100; }
        .fake-window { position: absolute; width: 300px; height: 180px; background: rgba(243, 243, 243, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); z-index: 10; overflow: hidden; display: flex; flex-direction: column; }
        .win11-header { width: 100%; height: 32px; display: flex; justify-content: space-between; align-items: center; padding-left: 12px; font-size: 12px; color: #1a1a1a; font-family: sans-serif; }
        .fake-close { width: 46px; height: 32px; display: flex; justify-content: center; align-items: center; font-family: sans-serif; font-size: 10px; cursor: pointer; border-top-right-radius: 7px; transition: 0.1s; }
        .fake-close:hover { background: #e81123; color: #fff; }
        @keyframes flash { 0% { background: #fff; color: #000; } 50% { background: #000; color: #fff; } }
        .flash-win { flex-grow: 1; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; text-align: center; animation: flash 0.666s infinite steps(1); line-height: 1.3; }
        
        /* Caja de diálogo de salida simulada */
        #fake-alert-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 360px; background: #f3f3f3; border: 1px solid #bbb; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 10000; display: none; flex-direction: column; font-family: sans-serif; padding: 16px; color: #1a1a1a; }
        #fake-alert-msg { font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        #fake-alert-btn { align-self: flex-end; padding: 6px 24px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        #fake-alert-btn:hover { background: #006cc1; }
    </style>
</head>
<body>

    <div id="speaker-btn" onclick="toggleBeep(event)">🔈</div>
    <div id="bg-text">You are an idiot!<span>☺ ☺ ☺</span></div>

    <!-- El botón X de cierre de la página (Home) -->
    <div style="position: absolute; top: 0; right: 0; width: 46px; height: 32px; display: flex; justify-content: center; align-items: center; font-family: sans-serif; font-size: 12px; cursor: pointer; z-index: 200; background: transparent; color: #333;" onmouseover="this.style.background='#e81123'; this.style.color='#fff';" onmouseout="this.style.background='transparent'; this.style.color='#333';" onclick="triggerHomeExitAlert(event)">✕</div>

    <!-- Caja de diálogo simulada para salir del sitio -->
    <div id="fake-alert-box">
        <div id="fake-alert-msg">¿Realmente quieres salir del sitio web?</div>
        <button id="fake-alert-btn" onclick="closeFakeAlert(event)">Aceptar</button>
    </div>

    <script>
        const windows = [];
        const winWidth = 300, winHeight = 180;
        let audioCtx = null, mainOsc = null, beepInterval = null, isBeeping = false;

        class FakeWindow {
            constructor(x, y, dx, dy) {
                this.el = document.createElement('div');
                this.el.className = 'fake-window';
                
                const header = document.createElement('div');
                header.className = 'win11-header';
                header.innerHTML = `<span>Hi!</span><div class="fake-close">✕</div>`;
                header.querySelector('.fake-close').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.el.remove();
                    windows.splice(windows.indexOf(this), 1);
                    for(let i=0; i<3; i++) spawn();
                });
                
                const inner = document.createElement('div');
                inner.className = 'flash-win';
                inner.innerText = "You are an idiot!\n☺ ☺ ☺";
                
                this.el.appendChild(header);
                this.el.appendChild(inner);
                document.body.appendChild(this.el);
                
                Object.assign(this, { x, y, dx, dy });
                this.update();
            }

            move() {
                this.x += this.dx; this.y += this.dy;
                if (this.x <= 0 || this.x + winWidth >= window.innerWidth) this.dx *= -1;
                if (this.y <= 0 || this.y + winHeight >= window.innerHeight) this.dy *= -1;
                this.x = Math.max(0, Math.min(this.x, window.innerWidth - winWidth));
                this.y = Math.max(0, Math.min(this.y, window.innerHeight - winHeight));
                this.update();
            }

            update() {
                this.el.style.left = this.x + 'px';
                this.el.style.top = this.y + 'px';
            }
        }

        // Sintetizador de audio integrado
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            mainOsc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            mainOsc.type = 'sine'; 
            mainOsc.frequency.setValueAtTime(440, audioCtx.currentTime);
            
            setInterval(() => {
                if(audioCtx && mainOsc) {
                    const t = audioCtx.currentTime;
                    mainOsc.frequency.setValueAtTime(330, t);
                    mainOsc.frequency.setValueAtTime(440, t + 0.15);
                    mainOsc.frequency.setValueAtTime(550, t + 0.3);
                    mainOsc.frequency.setValueAtTime(440, t + 0.45);
                }
            }, 600);

            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            mainOsc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            mainOsc.start();
        }

        function spawn() {
            initAudio(); 
            if (windows.length > 60) return;
            let x = Math.random() * (window.innerWidth - winWidth);
            let y = Math.random() * (window.innerHeight - winHeight);
            let dx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 4 + 6);
            let dy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 4 + 6);
            windows.push(new FakeWindow(x, y, dx, dy));
        }

        function triggerHomeExitAlert(e) {
            e.stopPropagation();
            initAudio();
            document.getElementById('fake-alert-box').style.display = 'flex';
        }

        function closeFakeAlert(e) {
            e.stopPropagation();
            document.getElementById('fake-alert-box').style.display = 'none';
            spawn();
        }

        function toggleBeep(e) {
            e.stopPropagation();
            initAudio();
            
            if (!isBeeping) {
                document.getElementById('speaker-btn').innerText = "🔊";
                isBeeping = true;

                beepInterval = setInterval(() => {
                    if (!audioCtx) return;
                    
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
                    
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                }, 500);

            } else {
                if (beepInterval) {
                    clearInterval(beepInterval);
                    beepInterval = null;
                }
                document.getElementById('speaker-btn').innerText = "🔈";
                isBeeping = false;
            }
        }

        function animate() {
            windows.forEach(win => win.move());
            requestAnimationFrame(animate);
        }

        window.addEventListener('click', spawn);
        window.addEventListener('resize', () => {
            windows.forEach(win => {
                win.x = Math.min(win.x, window.innerWidth - winWidth);
                win.y = Math.min(win.y, window.innerHeight - winHeight);
            });
        });

        animate();
    </script>
</body>
</html>
